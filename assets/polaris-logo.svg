<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="starGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="starGradSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#060a13" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows / Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Star -->
  <circle cx="60" cy="60" r="54" fill="url(#starGlow)" />

  <!-- Orbital Compass Rings -->
  <circle cx="60" cy="60" r="42" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="3 6" />
  <circle cx="60" cy="60" r="28" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- The 8-Pointed Polaris Star Mark -->
  <g filter="url(#glow)">
    <!-- Diagonal Spikes (Secondary) -->
    <polygon points="60,60 76,44 60,32 44,44" fill="url(#starGradSecondary)" opacity="0.85" />
    <polygon points="60,60 88,60 76,76 60,60" fill="url(#starGradSecondary)" opacity="0.75" />
    <polygon points="60,60 60,88 44,76 60,60" fill="url(#starGradSecondary)" opacity="0.85" />
    <polygon points="60,60 32,60 44,44 60,60" fill="url(#starGradSecondary)" opacity="0.75" />
    <!-- Secondary small tips -->
    <polygon points="60,60 81,39 60,60 39,81" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <polygon points="60,60 81,81 60,60 39,39" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Cardinal Diamond Blades (Primary) -->
    <!-- North Blade -->
    <polygon points="60,10 66,54 60,60" fill="url(#starGradPrimary)" />
    <polygon points="60,10 54,54 60,60" fill="url(#starGradSecondary)" />
    <!-- South Blade -->
    <polygon points="60,110 66,66 60,60" fill="url(#starGradSecondary)" />
    <polygon points="60,110 54,66 60,60" fill="url(#starGradPrimary)" />
    <!-- East Blade -->
    <polygon points="110,60 66,66 60,60" fill="url(#starGradPrimary)" />
    <polygon points="110,60 66,54 60,60" fill="url(#starGradSecondary)" />
    <!-- West Blade -->
    <polygon points="10,60 54,66 60,60" fill="url(#starGradSecondary)" />
    <polygon points="10,60 54,54 60,60" fill="url(#starGradPrimary)" />

    <!-- Central Crystalline Core -->
    <polygon points="60,46 74,60 60,74 46,60" fill="#ffffff" />
    <polygon points="60,51 69,60 60,69 51,60" fill="#38bdf8" />
    <circle cx="60" cy="60" r="2.5" fill="#ffffff" />
  </g>

  <!-- Typography: POLARIS -->
  <g transform="translate(132, 0)">
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="8" fill="url(#textGrad)">POLARIS</text>
    <circle cx="282" cy="46" r="3.5" fill="#00f0ff" />
    
    <!-- Subtitle -->
    <text x="2" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.5" fill="url(#subGrad)" opacity="0.95">MODS • OPTIMIZATION • GAMING HUB</text>

    <!-- Aesthetic Decorative Line -->
    <line x1="2" y1="98" x2="340" y2="98" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="2" y1="98" x2="70" y2="98" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
